<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Narrative Player</title>
  </head>
  <body>
    <div id="app">
      <!-- Seletor de Projeto -->
      <div id="project-selector" class="panel">
        <h2>📚 Selecione um Projeto</h2>
        <select id="project-list">
          <option value="">-- Selecione --</option>
        </select>
        <div>
          <button id="load-project">▶️ Carregar</button>
          <button id="refresh-projects">🔄 Atualizar Lista</button>
        </div>
      </div>

      <!-- Container do Player -->
      <div id="player-container" style="display: none;">
        <!-- ✅ HEADER COM BOTÃO DE VOLTAR -->
        <div id="player-header">
          <button id="back-to-home-btn" class="back-btn" title="Voltar para seleção de projetos">
            ← Voltar
          </button>
          <h3 id="project-title">Projeto</h3>
        </div>

        <!-- Vídeo -->
        <div id="video-wrapper">
          <!-- ✅ Vídeo sem controles nativos -->
          <video id="video-player" playsinline></video>
          
          <!-- Overlay de Escolhas -->
          <div id="choices-overlay" class="hidden">
            <div class="choices-container">
              <h3 id="choices-title">Faça sua escolha:</h3>
              <div id="choices-buttons"></div>
              <div id="timeout-bar" class="hidden">
                <div id="timeout-progress"></div>
              </div>
            </div>
          </div>

          <!-- Overlay de Final -->
          <div id="end-overlay" class="hidden">
            <div class="end-container">
              <div id="end-icon"></div>
              <h2 id="end-title">Fim da História</h2>
              <p id="end-message"></p>
              <button id="restart-button">🔄 Recomeçar</button>
            </div>
          </div>

          <!-- ✅ CONTROLES CUSTOMIZADOS -->
          <div id="custom-controls">
            <div id="progress-container">
              <div id="progress-bar">
                <div id="progress-filled"></div>
                <div id="progress-handle"></div>
              </div>
              <div id="time-display">
                <span id="current-time">0:00</span>
                <span id="separator">/</span>
                <span id="total-time">0:00</span>
              </div>
            </div>
            
            <div id="controls-buttons">
              <button id="play-pause-btn" class="control-btn">▶️</button>
              <button id="mute-btn" class="control-btn">🔊</button>
              <input type="range" id="volume-slider" min="0" max="100" value="100" />
              
              <!-- ✅ CONTROLE DE VELOCIDADE -->
              <div class="speed-control">
                <button id="speed-btn" class="control-btn" title="Velocidade de reprodução">1x</button>
                <div id="speed-menu" class="speed-menu hidden">
                  <button class="speed-option" data-speed="0.25">0.25x</button>
                  <button class="speed-option" data-speed="0.5">0.5x</button>
                  <button class="speed-option" data-speed="0.75">0.75x</button>
                  <button class="speed-option active" data-speed="1">Normal</button>
                  <button class="speed-option" data-speed="1.25">1.25x</button>
                  <button class="speed-option" data-speed="1.5">1.5x</button>
                  <button class="speed-option" data-speed="2">2x</button>
                </div>
              </div>
              
              <button id="fullscreen-btn" class="control-btn">⛶</button>
            </div>
          </div>
        </div>

        <!-- Debug Info -->
        <div id="debug-panel">
          <div class="debug-item">
            <strong>Nó Atual:</strong> <span id="current-node">-</span>
          </div>
          <div class="debug-item">
            <strong>Tempo Virtual:</strong> <span id="virtual-time">0:00 / 0:00</span>
          </div>
          <div class="debug-item">
            <strong>Caminho:</strong> <span id="path-history">-</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

limit_req_zone $binary_remote_addr zone=media_rate:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=media_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    sendfile on;
    aio threads;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /hls/ {
        limit_req zone=media_rate burst=60 nodelay;
        limit_conn media_connections 20;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 m4s mp4;
            image/jpeg jpg jpeg;
        }

        try_files $uri =404;
    }

    location ~* \.(ts|m4s)$ {
        limit_req zone=media_rate burst=60 nodelay;
        limit_conn media_connections 20;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }

    location ~* \.m3u8$ {
        limit_req zone=media_rate burst=60 nodelay;
        limit_conn media_connections 20;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

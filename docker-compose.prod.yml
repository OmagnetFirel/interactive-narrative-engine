services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ine_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ine_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ine_user} -d ${POSTGRES_DB:-ine_database}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ine_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ine_database}
      UPLOAD_DIR: /data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      CORS_ORIGINS: https://${EDITOR_DOMAIN},https://${PLAYER_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
      PUBLIC_MEDIA_URL: https://${MEDIA_DOMAIN}
      PUBLIC_PLAYER_URL: https://${PLAYER_DOMAIN}
      PUBLIC_EDITOR_URL: https://${EDITOR_DOMAIN}
      MAX_AUTHORS: ${MAX_AUTHORS:-5}
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-3}
      MAX_UPLOAD_BYTES_PER_USER: ${MAX_UPLOAD_BYTES_PER_USER:-5368709120}
      RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-300}
      RATE_LIMIT_INVITES: ${RATE_LIMIT_INVITES:-20}
      RATE_LIMIT_PUBLIC_EXPENSIVE: ${RATE_LIMIT_PUBLIC_EXPENSIVE:-60}
    volumes:
      - uploads_data:/data/uploads
    expose: ["3001"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [backend]

  editor:
    build:
      context: .
      dockerfile: docker/Dockerfile.editor
      args:
        VITE_API_URL: https://${API_DOMAIN}
        VITE_PLAYER_URL: https://${PLAYER_DOMAIN}
        VITE_MEDIA_URL: https://${MEDIA_DOMAIN}
        VITE_UPLOAD_API_URL: https://${UPLOAD_DOMAIN}
    restart: unless-stopped
    expose: ["80"]
    networks: [backend]

  player:
    build:
      context: .
      dockerfile: docker/Dockerfile.player
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    expose: ["80"]
    networks: [backend]

  media:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - uploads_data:/usr/share/nginx/html:ro
      - ./docker/nginx-media.prod.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      EDITOR_DOMAIN: ${EDITOR_DOMAIN}
      PLAYER_DOMAIN: ${PLAYER_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      UPLOAD_DOMAIN: ${UPLOAD_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      editor:
        condition: service_started
      player:
        condition: service_started
      media:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
